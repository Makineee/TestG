<script>
const R1=[

const $=s=>document.querySelector(s),app=$("#app"),N=5,M=["🐪","🦅","🐉","🐎","🐅"];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

let db,G=null,T={},isAdmin=false,isScreen=false,me=null,formFor=null,ready=false,PIN="";
try{const v=sessionStorage.getItem("team");if(v!==null)me=+v}catch(e){}
const fresh=()=>({phase:"lobby",scores:[5,5,5,5,5],rv:0,tAns:{},tR1:null,tScore2:0,tReveal:false,r1Start:0,r1rank:[],q:0,qs:[],qStart:0,owner:null,steal:false,out:[],answering:null,answer:null,done:false,msg:"",flash:""});

function makeDb(){
 const L={g:[],t:[]};let S={game:null,teams:{}};
 const gs=()=>({exists:!!S.game,data:()=>S.game});
 const ts=()=>({docs:Object.entries(S.teams).map(([id,v])=>({id,data:()=>v}))});
 const es=new EventSource("/events");
 es.onmessage=e=>{S=JSON.parse(e.data);off=(S.now||Date.now())-Date.now();L.g.forEach(f=>f(gs()));L.t.forEach(f=>f(ts()))};
 const send=(path,op,data)=>fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path,op,data,pin:PIN})}).then(r=>{if(!r.ok)throw new Error("Wrong PIN or no permission")});
 return {doc:p=>({onSnapshot:f=>{L.g.push(f)},set:d=>send(p,"set",d),update:d=>send(p,"update",d)}),collection:()=>({onSnapshot:f=>{L.t.push(f)}})};
}

let AC=null,muted=true,lastTk="",tready=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,t0,d,type,v){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type||"sine";o.frequency.value=f;
 g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v||.15,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
const seq=(fs,gap,d,type,v)=>fs.forEach((f,i)=>tone(f,i*gap,d,type,v));
const SFX={
 start:()=>seq([392,523,659,784],.12,.3,"triangle",.16),
 tick:()=>tone(880,0,.08,"square",.09),
 end:()=>{[0,.4,.8].forEach(t=>{tone(880,t,.32,"square",.3);tone(660,t,.32,"square",.3)});tone(110,0,1.3,"sawtooth",.3)},
 buzz:()=>{tone(660,0,.1,"square",.08);tone(990,.08,.15,"square",.08)},
 pick:()=>seq([440,660],.1,.2,"triangle",.14),
 correct:()=>seq([523,659,784,1047],.09,.28,"sine",.16),
 wrong:()=>{tone(220,0,.25,"sawtooth",.12);tone(165,.2,.45,"sawtooth",.12)},
 steal:()=>seq([300,500,800],.07,.15,"square",.07),
 submit:()=>seq([700,900],.06,.1,"sine",.12),
 result:()=>{seq([262,330,392],0,.8,"triangle",.1);tone(523,.3,.6,"triangle",.12)},
 walk:d=>{for(let i=0;i<d/450;i++)tone(i%2?110:90,i*.45,.18,"sine",.12)},
 win:()=>seq([523,523,523,659,784,659,784,1047],.13,.32,"triangle",.14)};
let musicOn=false,mg=null,mTimer=0,mNext=0,mStep=0,mIdx=3,noiseBuf=null;
const SCALE=[293.66,311.13,369.99,392,440,466.16,523.25,587.33,622.25];
function mnote(f,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
function mstep(step,t){
 if(step%16===0){mnote(73.42,t,3.2,"triangle",.09);mnote(110,t,3.2,"sine",.05)}
 if(step%8===0){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(45,t+.15);g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.3)}
 else if(step%4===0){if(!noiseBuf){noiseBuf=AC.createBuffer(1,2205,44100);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const n=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();n.buffer=noiseBuf;f.type="bandpass";f.frequency.value=3200;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.06);n.connect(f);f.connect(g);g.connect(mg);n.start(t)}
 if(Math.random()<.6){mIdx=Math.max(0,Math.min(SCALE.length-1,mIdx+[-2,-1,-1,0,1,1,2][Math.random()*7|0]));mnote(SCALE[mIdx],t,.7,"triangle",.07);if(step%8===0)mnote(SCALE[mIdx]/2,t,.9,"sine",.04)}
}
function msched(){if(!AC)return;const bpm=G&&(G.phase==="r1"||G.phase==="r2")?100:78;while(mNext<AC.currentTime+.5){mstep(mStep,mNext);mNext+=60/bpm/2;mStep=(mStep+1)%32}}
function startMusic(){if(!ac())return;mg=AC.createGain();mg.gain.value=.8;mg.connect(AC.destination);mNext=AC.currentTime+.1;mStep=0;clearInterval(mTimer);mTimer=setInterval(msched,120)}
function stopMusic(){clearInterval(mTimer);if(mg){const g=mg;g.gain.setTargetAtTime(0,AC.currentTime,.05);setTimeout(()=>{try{g.disconnect()}catch(e){}},400);mg=null}}
function change(pg,g,pt,t){
 if(!pg||!g)return;
 if(g.phase!==pg.phase){if(g.phase==="r1"||g.phase==="r2")travel(g.phase==="r1"?1:2);({r1:SFX.start,r2:SFX.start,r1result:SFX.result,end:SFX.win})[g.phase]?.();if(g.phase==="end")confetti();return}
 if(g.tReveal&&!pg.tReveal){SFX.win();confetti();return}
 if(g.phase==="r1review"&&g.rv!==pg.rv)SFX.pick();
 if(g.phase==="r1")for(let i=0;i<N;i++)if(t["t"+i]?.r1&&!pt["t"+i]?.r1)SFX.submit();
 if(g.phase==="r2"){
  if(g.q!==pg.q){SFX.start();return}
  if(g.done&&!pg.done){const m=g.msg||"";if(m.includes("stole")){SFX.steal();setTimeout(SFX.correct,300);confetti()}else if(m.includes("correct")){SFX.correct();confetti()}else if(m.includes("No team"))SFX.wrong();return}
  if(g.answering!=null&&pg.answering==null){SFX.pick();if(g.answering===me)try{navigator.vibrate&&navigator.vibrate([200,80,200])}catch(e){}}
  if(g.out.length>pg.out.length)SFX.wrong();
  const k=g.q+"-"+g.out.length;
  for(let i=0;i<N;i++)if(t["t"+i]?.buzzKey===k&&pt["t"+i]?.buzzKey!==k)SFX.buzz();
 }
}

const CITY={a:[780,230,"Chang'an"],b:[430,200,"Taklamakan Desert"],c:[110,262,"Mediterranean"]};
const SEG=["M780,230 C700,120 560,320 430,200","M430,200 C330,110 240,330 110,262"];
function travel(r){
 let el=$("#trip");if(!el){el=document.createElement("div");el.id="trip";document.body.appendChild(el)}
 const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,dur=reduce?1500:4000;
 const pt=(k,fill)=>`<circle cx="${CITY[k][0]}" cy="${CITY[k][1]}" r="12" fill="${fill}" stroke="#fff" stroke-width="2"/><text x="${CITY[k][0]}" y="${CITY[k][1]+30}" text-anchor="middle" fill="#f6efe3" font-size="26" font-family="Georgia,serif">${CITY[k][2]}</text>`;
 el.className="";el.innerHTML=`<h2>Round ${r}: ${r===1?"From Chang'an to the Taklamakan Desert":"From the Taklamakan Desert to the Mediterranean"}</h2>
 <svg viewBox="0 0 900 400" aria-hidden="true"><rect width="900" height="400" rx="22" fill="#2a2058" stroke="rgba(255,255,255,.18)"/>
 <path d="M560 60 Q700 40 860 90 L870 330 Q700 380 560 330 Q500 200 560 60Z" fill="#3f3277"/><path d="M30 90 Q200 40 380 80 Q470 200 380 340 Q200 380 30 330Z" fill="#3f3277"/>
 <ellipse cx="430" cy="215" rx="115" ry="70" fill="#c98b4b" opacity=".85"/><path d="M0 300 Q60 240 140 300 Q100 400 0 400Z" fill="#2a7fa8"/><path d="M40 300 Q100 285 170 320" stroke="#7bd0ee" fill="none" stroke-width="2"/>
 <g fill="#8a7bc0"><path d="M330 90l18 30h-36zM365 100l14 24h-28zM600 300l16 28h-32zM640 290l12 22h-24z"/></g>
 <path d="${SEG[0]}" fill="none" stroke="${r===2?"#ffc94a":"rgba(255,255,255,.35)"}" stroke-width="4" stroke-dasharray="${r===2?"none":"8 10"}"/>
 <path id="sg" d="${SEG[r-1]}" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="4" stroke-dasharray="8 10"/>
 <path id="tr" d="${SEG[r-1]}" fill="none" stroke="#ffc94a" stroke-width="5" stroke-linecap="round"/>
 ${pt("a",r===2?"#ffc94a":"#ff7a59")}${pt("b","#3fd0c9")}${r===2?pt("c","#7be495"):""}
 <text id="cm2" font-size="64" text-anchor="middle" x="0" y="0">🐪</text></svg>`;
 const p=$("#sg"),tr=$("#tr"),cm=$("#cm2"),L=p.getTotalLength(),t0=performance.now();let done=false;
 const end=()=>{if(done)return;done=true;el.classList.add("out")};
 setTimeout(end,dur+500);
 SFX.walk(dur);
 (function f(now){if(done)return;let u=Math.min(1,(now-t0)/dur);const e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,q=p.getPointAtLength(L*e);
  tr.setAttribute("stroke-dasharray",(L*e)+" "+L);cm.setAttribute("transform",`translate(${q.x},${q.y-14+Math.sin(u*60)*4})`);
  if(u<1)requestAnimationFrame(f)})(t0);
}
function init(){
 if(location.hash==="#admin"){PIN=prompt("Enter host PIN:")||"";isAdmin=true}
 if(location.hash==="#screen"){isScreen=true;document.body.classList.add("screen")}
 db=makeDb();
 const wl=()=>{try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}};wl();document.addEventListener("visibilitychange",()=>{if(!document.hidden)wl()});
 $("#snd").onclick=()=>{muted=!muted;if(!muted){ac();SFX.pick()}$("#snd").textContent=muted?"🔇 Sound off":"🔊 Sound on";if(isScreen&&musicOn===muted){musicOn=!muted;musicOn?startMusic():stopMusic();$("#mus").textContent=musicOn?"🎵 Music on":"🎵 Music off"}};
 if(!isScreen)$("#mus").style.display="none";
 $("#mus").onclick=()=>{musicOn=!musicOn;musicOn?startMusic():stopMusic();$("#mus").textContent=musicOn?"🎵 Music on":"🎵 Music off"};
 db.doc("game/state").onSnapshot(s=>{const n=s.exists?s.data():null;if(tready)change(G,n,T,T);G=n;ready=true;render()});

}

 if(sels.length){const refresh=()=>{const used=sels.map(x=>x.value).filter(Boolean);sels.forEach(x=>{const cur=x.value;$("#cnt").textContent=used.length+"/10 matched";$("#sub").disabled=used.length<R1.length;x.innerHTML='<option value="">Choose a word…</option>'+r1opts.filter(w=>w===cur||!used.includes(w)).map(w=>`<option${w===cur?" selected":""}>${esc(w)}</option>`).join("")})};sels.forEach(x=>x.onchange=refresh)}
 tickTimers();
}
function submitR1(){
 if(tm(me).r1)return;
 let c=0,w=0,f=0;const a=[];document.querySelectorAll("#f1 select").forEach(s=>{const i=+s.dataset.i;a[i]=s.value||"";if(!s.value)return;f++;s.value===R1[i][0]?c++:w++});
 const el=Math.max(0,Math.min(120,(now()-G.r1Start)/1000));
 const o={c,w,el,full:f===R1.length,a};T["t"+me]={...tm(me),r1:o};tsave(me,{r1:o});render();
}
function tickTimers(){
 if(G){const a=$("#at");if(a&&G.ansAt){const l=Math.max(0,Math.ceil(15-(now()-G.ansAt)/1000));a.textContent=l;a.classList.toggle("low",l<=3)}
  if(G.phase==="r2"){const rd=now()<G.qStart+READ,h=$("#rd");if(h)h.textContent=rd?"📖 Read the question… hands up when the timer ends":"✋ Raise your hand if you know!";
   const z=$("#bz");if(z&&!isAdmin&&!isScreen&&me!=null&&tm(me).buzzKey!==G.q+"-"+G.out.length){z.disabled=rd;z.textContent=rd?"📖 Reading…":"✋ RAISE HAND"}}
  const b=$("#bw");if(b&&G.buzzAt)b.textContent=Math.max(0,Math.ceil(6-(now()-G.buzzAt)/1000))}
 if(G&&me===5&&G.phase==="r2"&&$("#twait")&&now()>=G.qStart+READ)render();
 const e=$("#tm");if(!e||!G)return;let left;
 if(G.phase==="r1"){left=Math.min(120,Math.max(0,Math.ceil(120-(now()-G.r1Start)/1000)));e.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");if(left<=0&&!isAdmin&&!isScreen&&me!=null&&!tm(me).r1&&$("#f1"))submitR1()}
 else if(G.phase==="r2"){left=G.done?0:Math.min(15,Math.max(0,Math.ceil(15-(now()-G.qStart)/1000)));e.textContent=left}
 e.classList.toggle("low",left<=(G.phase==="r1"?15:5));
 const k=G.phase+G.q+":"+left,pv=lastTk;lastTk=k;
 if(k!==pv&&!(G.phase==="r2"&&G.done)){if(left>0&&left<=(G.phase==="r1"?10:5))SFX.tick();else if(left===0&&pv)SFX.end()}
}
init();
</script></body></html>
